name: Build desktop apps

# Builds the standalone desktop executables (a Windows .exe and a macOS .app)
# with PyInstaller, self-tests each on its own OS, and — when triggered by a
# release — attaches them to that release for download.
#
# A Windows .exe can only be built on Windows and a macOS .app only on macOS,
# which is exactly why this runs on GitHub's matrix of real runners rather than
# being cross-built from one machine.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe)
            binary: dist/H5Grid.exe
            asset: H5Grid-windows-x64.exe
          - os: macos-latest
            label: macOS (.app)
            binary: dist/H5Grid
            asset: H5Grid-macos-arm64.zip

    steps:
      - uses: actions/checkout@v7

      # 1. Build the web interface into backend/h5grid/static — the app serves
      #    nothing without it, and PyInstaller bundles it from there.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install app and build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" pyinstaller

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/h5grid.spec --noconfirm

      # 2. Prove the frozen binary actually works — importantly that hdf5plugin's
      #    blosc filters were bundled, by reading a compressed fixture. If this
      #    fails, the build is broken and must not be attached to a release.
      - name: Generate a test fixture
        run: python backend/tests/make_fixtures.py
      - name: Self-test the binary
        run: |
          "${{ matrix.binary }}" --selftest backend/tests/fixtures/pywr_style.h5

      # 3. Package the downloadable asset. Windows ships the .exe directly; macOS
      #    ships the .app bundle zipped (ditto preserves the bundle structure and
      #    resource forks).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/H5Grid.app" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # 4. On a release, attach the binary to it so people can download it.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
